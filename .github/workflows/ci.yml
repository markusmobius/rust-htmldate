name: Rust HTML Date Extraction

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: '1'
      RUST_TEST_THREADS: '1'
      TZ: UTC
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo test --locked --release
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: git diff --exit-code -- Cargo.lock data testdata LICENSE